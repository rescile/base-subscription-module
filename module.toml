#schemas = ["./schemas/identity.schema.json"]

[module]
name = "Base Subscription Module"
url = "https://github.com/rescile/base_subscription_module"
version = "0.0.1"
description = "A base subscription provides a enables a consistent and repeatable provisioning process for multi-cloud environments."
rescile_version = ">=0.1.193"

# List of other modules this module depends on.
[dependencies]
graphviewer = "https://github.com/rescile/graphviewer"
asset-editor = "https://github.com/rescile/asset-editor-module"
graphiql-module = "https://github.com/rescile/rescile-graphiql-module"
aws-provider = "https://github.com/rescile/aws-provider-module"

[params.solution]
description = "A freeform name describing the service that is deployed, this entry is used for naming conventions."
required = true
default = "Solution"

# Temp entry for offline development
[params.tenant]
description = "The tenant represents the organization that owns a service."
required = true
default = "Rescile"
