[[control]]
id = "RULE"
name = "allow_dns"

[[control.target]]
description = "Network Policies"
origin_resource_types = [ "egress" ]

[control.target.resource.properties]
action = "allow"
priority = 110
protocol = "udp"
source = ["self"]
destination = ["resolver"]
destination_ports = ["53"]
log = true
