        <!-- Document Utility & Modular Handlers Script Block -->
        <script>
            const SVGS = {
                light_mode:
                    '<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M480-360q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35Zm0 80q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Zm326-268Z"/></svg>',
                dark_mode:
                    '<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z"/></svg>',
                check: '<svg xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px" fill="currentColor"><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></svg>',
            };

            function toggleOverlay(show) {
                const el = document.getElementById("endpoints-overlay");
                if (el) {
                    if (show) el.classList.add("active");
                    else el.classList.remove("active");
                }
            }
            function handleOverlayClick(e) {
                if (e.target.id === "endpoints-overlay") toggleOverlay(false);
            }
            function toggleInfoOverlay(show) {
                const el = document.getElementById("info-overlay");
                if (el) {
                    if (show) el.classList.add("active");
                    else el.classList.remove("active");
                }
            }
            function handleInfoOverlayClick(e) {
                if (e.target.id === "info-overlay") toggleInfoOverlay(false);
            }

            let currentActionsPage = 1;
            const actionsPerPage = 5;

            function updateActionsPagination() {
                const list = document.getElementById("actions-list");
                const controls = document.getElementById(
                    "actions-pagination-controls",
                );
                if (!list || !controls) return;

                const items = Array.from(list.children).filter(
                    (child) => child.tagName === "LI",
                );
                const matchingItems = items.filter(
                    (item) => !item.classList.contains("hidden"),
                );
                const totalPages = Math.ceil(
                    matchingItems.length / actionsPerPage,
                );
                if (currentActionsPage > totalPages)
                    currentActionsPage = totalPages || 1;

                items.forEach((item) => {
                    item.style.display = "none";
                });

                const start = (currentActionsPage - 1) * actionsPerPage;
                const end = start + actionsPerPage;

                matchingItems.slice(start, end).forEach((item) => {
                    item.style.display = "";
                });

                if (totalPages > 1) {
                    controls.style.display = "flex";
                    document.getElementById("actions-page-info").innerText =
                        `Page ${currentActionsPage} of ${totalPages}`;
                    document.getElementById("actions-btn-prev").disabled =
                        currentActionsPage === 1;
                    document.getElementById("actions-btn-next").disabled =
                        currentActionsPage === totalPages;
                } else {
                    controls.style.display = "none";
                }
            }

            function changeActionsPage(dir) {
                currentActionsPage += dir;
                updateActionsPagination();
            }

            function toggleTheme() {
                const html = document.documentElement;
                const icon = document.getElementById("theme-icon");
                const isDark = html.getAttribute("data-theme") === "dark";

                const next = isDark ? "light" : "dark";
                html.setAttribute("data-theme", next);
                if (icon)
                    icon.innerHTML =
                        next === "dark" ? SVGS.light_mode : SVGS.dark_mode;
                localStorage.setItem("theme", next);
            }

            const savedTheme = localStorage.getItem("theme");
            const systemDark = window.matchMedia(
                "(prefers-color-scheme: dark)",
            ).matches;
            const initialTheme = savedTheme || (systemDark ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", initialTheme);

            let currentPage = 1;
            const itemsPerPage = 5;

            function updatePagination() {
                const list = document.getElementById("downloads-list");
                const controls = document.getElementById("pagination-controls");
                if (!list || !controls) return;

                const items = Array.from(list.children);
                const matchingItems = items.filter(
                    (item) => !item.classList.contains("hidden"),
                );
                const totalPages = Math.ceil(
                    matchingItems.length / itemsPerPage,
                );
                if (currentPage > totalPages) currentPage = totalPages || 1;

                items.forEach((item) => {
                    item.style.display = "none";
                });

                const start = (currentPage - 1) * itemsPerPage;
                const end = start + itemsPerPage;

                matchingItems.slice(start, end).forEach((item) => {
                    item.style.display = "";
                });

                if (totalPages > 1) {
                    controls.style.display = "flex";
                    document.getElementById("page-info").innerText =
                        `Page ${currentPage} of ${totalPages}`;
                    document.getElementById("btn-prev").disabled =
                        currentPage === 1;
                    document.getElementById("btn-next").disabled =
                        currentPage === totalPages;
                } else {
                    controls.style.display = "none";
                }
            }

            function changePage(dir) {
                currentPage += dir;
                updatePagination();
            }

            async function copyText(text, btn) {
                try {
                    const fullUrl = text.startsWith("/")
                        ? window.location.origin + text
                        : text;
                    await navigator.clipboard.writeText(fullUrl);

                    const icon =
                        btn.querySelector(".material-symbols-outlined") || btn;
                    const originalIcon = icon.innerHTML;
                    icon.innerHTML = SVGS.check;
                    btn.style.color = "#10b981";

                    setTimeout(() => {
                        icon.innerHTML = originalIcon;
                        btn.style.color = "";
                    }, 2000);
                } catch (err) {
                    console.error("Failed to copy: ", err);
                }
            }

            async function downloadActionInstruction(moduleId, actionName) {
                try {
                    const actsRes = await fetch(
                        "/api/actions" + window.location.search,
                    );
                    const acts = await actsRes.json();
                    const action = acts.find(
                        (a) =>
                            a.module_id === moduleId && a.name === actionName,
                    );
                    if (!action) {
                        alert("Action not found");
                        return;
                    }

                    const inputs = action.input || [];
                    let payload = {};

                    if (inputs.length > 0) {
                        const modal = document.createElement("div");
                        modal.className =
                            "fixed inset-0 flex items-center justify-center p-4 z-[3000] transition-colors duration-200";
                        modal.style.backgroundColor = "var(--overlay-bg)";

                        let formHtml = `
                            <div class="bg-appCard text-appFg border border-appBorder rounded-xl shadow-xl w-full max-w-md p-6 overflow-hidden transform transition-all">
                                <h3 class="text-lg font-semibold tracking-tight text-appPrimary mb-4">Input Parameters: ${actionName}</h3>
                                <form id="action-form" class="space-y-4">`;

                        for (const inp of inputs) {
                            const prop = inp.name;
                            const desc = inp.description || prop;
                            const defaultVal =
                                inp.default !== undefined &&
                                inp.default !== null
                                    ? inp.default
                                    : "";

                            if (inp.resource_link) {
                                const parts = inp.resource_link.split(".");
                                const resType = parts[0];
                                const resProp = parts[1] || "name";

                                let optionsHtml = `<option value="">Select ${resType}</option>`;
                                try {
                                    const res = await fetch(
                                        "/graphql" + window.location.search,
                                        {
                                            method: "POST",
                                            headers: {
                                                "Content-Type":
                                                    "application/json",
                                            },
                                            body: JSON.stringify({
                                                query: `{ ${resType} { ${resProp} } }`,
                                            }),
                                        },
                                    );
                                    const json = await res.json();
                                    if (json.data && json.data[resType]) {
                                        const uniqueVals = [
                                            ...new Set(
                                                json.data[resType]
                                                    .map(
                                                        (item) => item[resProp],
                                                    )
                                                    .filter(Boolean),
                                            ),
                                        ].sort();
                                        for (const val of uniqueVals) {
                                            const selected =
                                                val === defaultVal
                                                    ? "selected"
                                                    : "";
                                            optionsHtml += `<option value="${val}" ${selected}>${val}</option>`;
                                        }
                                    }
                                } catch (e) {
                                    console.error(
                                        "Failed to fetch resource link data",
                                        e,
                                    );
                                }

                                formHtml += `
                                    <div>
                                        <label class="block text-sm font-medium mb-1.5 opacity-90">${desc} *</label>
                                        <select name="${prop}" required class="w-full bg-appBg text-appFg border border-appBorder rounded-lg px-3 py-2 outline-none focus:border-appPrimary transition-all appearance-auto text-sm">
                                            ${optionsHtml}
                                        </select>
                                    </div>`;
                            } else {
                                formHtml += `
                                    <div>
                                        <label class="block text-sm font-medium mb-1.5 opacity-90">${desc} *</label>
                                        <input type="text" name="${prop}" value="${defaultVal}" required class="w-full bg-appBg text-appFg border border-appBorder rounded-lg px-3 py-2 outline-none focus:border-appPrimary transition-all text-sm" />
                                    </div>`;
                            }
                        }

                        formHtml += `
                                    <div class="flex gap-3 justify-end pt-2 mt-6 border-t border-appBorder">
                                        <button type="button" id="action-cancel" class="px-4 py-2 border border-appBorder bg-transparent hover:bg-appHover text-appFg rounded-lg text-sm font-medium transition-all">Cancel</button>
                                        <button type="submit" class="px-4 py-2 bg-appPrimary hover:opacity-90 text-white rounded-lg text-sm font-medium transition-all shadow-sm">Download</button>
                                    </div>
                                </form>
                            </div>`;

                        modal.innerHTML = formHtml;
                        document.body.appendChild(modal);

                        const submitted = await new Promise((resolve) => {
                            document.getElementById("action-cancel").onclick =
                                () => {
                                    document.body.removeChild(modal);
                                    resolve(false);
                                };
                            document.getElementById("action-form").onsubmit = (
                                e,
                            ) => {
                                e.preventDefault();
                                const formData = new FormData(e.target);
                                for (const [k, v] of formData.entries()) {
                                    const schemaType = inputs.find(
                                        (i) => i.name === k,
                                    )?.type;
                                    if (schemaType === "boolean") {
                                        payload[k] = v === "true";
                                    } else if (
                                        schemaType === "number" ||
                                        schemaType === "integer"
                                    ) {
                                        payload[k] = Number(v);
                                    } else {
                                        payload[k] = v;
                                    }
                                }
                                document.body.removeChild(modal);
                                resolve(true);
                            };
                        });

                        if (!submitted) return;
                    }

                    const res = await fetch(
                        "/api/actions/" +
                            moduleId +
                            "/" +
                            actionName +
                            window.location.search,
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(payload),
                        },
                    );
                    if (res.ok) {
                        const blob = await res.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url;
                        a.download = moduleId + "_" + actionName + ".tar.gz";
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        window.URL.revokeObjectURL(url);
                    } else {
                        const errText = await res.text();
                        alert("Failed to trigger action: " + errText);
                    }
                } catch (e) {
                    console.error("Action trigger failed", e);
                    alert("Action trigger failed");
                }
            }

            function clearSearch() {
                const searchEl = document.getElementById("main-search");
                if (searchEl) {
                    searchEl.value = "";
                    filterContent();
                    searchEl.focus();
                }
            }

            function filterContent() {
                const searchEl = document.getElementById("main-search");
                if (!searchEl) return;

                const clearBtn = document.getElementById("search-clear");
                if (clearBtn) {
                    if (searchEl.value.length > 0)
                        clearBtn.classList.add("active");
                    else clearBtn.classList.remove("active");
                }

                const query = searchEl.value.toLowerCase();
                const items = document.querySelectorAll(
                    ".card, .simple-list li",
                );
                const noResults = document.getElementById("no-results");
                let visibleCount = 0;

                items.forEach((item) => {
                    if (item.innerText.toLowerCase().includes(query)) {
                        item.classList.remove("hidden");
                        visibleCount++;
                    } else {
                        item.classList.add("hidden");
                    }
                });

                if (noResults) {
                    noResults.style.display =
                        visibleCount === 0 ? "block" : "none";
                }

                currentPage = 1;
                if (typeof updatePagination === "function") updatePagination();
                if (typeof updateActionsPagination === "function")
                    updateActionsPagination();

                const sections = document.querySelectorAll("h2");
                sections.forEach((h2) => {
                    let nextEl = h2.nextElementSibling;
                    let hasVisible = false;

                    let targetForSearch = nextEl;
                    if (nextEl && nextEl.id === "downloads-wrapper") {
                        targetForSearch = nextEl.querySelector(".simple-list");
                    }
                    if (nextEl && nextEl.id === "actions-wrapper") {
                        targetForSearch = nextEl.querySelector(".simple-list");
                    }

                    if (
                        targetForSearch &&
                        (targetForSearch.classList.contains("listing") ||
                            targetForSearch.classList.contains("simple-list"))
                    ) {
                        const innerCards =
                            targetForSearch.querySelectorAll(".card, li");
                        innerCards.forEach((c) => {
                            if (!c.classList.contains("hidden"))
                                hasVisible = true;
                        });
                        if (h2.classList.contains("section-header")) {
                            h2.style.display = hasVisible ? "flex" : "none";
                        } else {
                            h2.style.display = hasVisible ? "block" : "none";
                        }
                        if (
                            nextEl.id === "downloads-wrapper" ||
                            nextEl.id === "actions-wrapper"
                        ) {
                            nextEl.style.display = hasVisible
                                ? "block"
                                : "none";
                        }
                    }
                });
            }

            document.addEventListener("DOMContentLoaded", () => {
                const icon = document.getElementById("theme-icon");
                if (icon)
                    icon.innerHTML =
                        initialTheme === "dark"
                            ? SVGS.light_mode
                            : SVGS.dark_mode;
                updatePagination();

                document.addEventListener("click", (e) => {
                    const dropdowns =
                        document.querySelectorAll("details.dropdown");
                    dropdowns.forEach((details) => {
                        if (!details.contains(e.target)) {
                            details.removeAttribute("open");
                        }
                    });
                });

                if (typeof initApp === "function") initApp();
            });
        </script>
    </body>
</html>
