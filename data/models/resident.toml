# The resident is a top level node that represents the owner of a subscription in the graph

[[create_resource]]
resource_type = "resident"
name = "{{- tenant | lower -}}"
[create_resource.properties]
commercial_admin = "contract-manager"
technical_admin = "account-administrator"
description = "The resident {{- tenant | capitalize -}} is an organization that has private, secure access to the dedicated set of computing resources and services within the cloud infrastructure. Essentially, it is the technical term for the customer's dedicated partition where their data, applications, and virtual machines reside, isolated from other cloud customers."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
