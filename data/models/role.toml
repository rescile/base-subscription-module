origin_resource = "subscription"

[[create_resource]]
resource_type = "role"
relation_type = "BASELINE_TEMPLATE"
name = "account-administrator"
[create_resource.properties]
function = "administrator"
scope = "account"
description = "The cloud administrator creates a supueruser for a cloud account with full access to all settings."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

[[create_resource]]
resource_type = "role"
relation_type = "BASELINE_TEMPLATE"
name = "contract-manager"
[create_resource.properties]
function = "manager"
scope = "contract"
description = "The provider manager is a commercial contact at a cloud provider and responsible for billing and resource management."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

[[create_resource]]
resource_type = "role"
relation_type = "BASELINE_TEMPLATE"
name = "kubernetes-operator"
[create_resource.properties]
function = "operator"
scope = "kubernetes"
description = "The Kubernetes operator has the necessary permissions to manage the Kubernetes resources at a cloud provider."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

[[create_resource]]
resource_type = "role"
relation_type = "BASELINE_TEMPLATE"
name = "cloud-auditor"
[create_resource.properties]
function = "auditor"
scope = "cloud"
description = "The cloud compliance auditor ensures that an organization’s cloud footprint follows specific regulatory frameworks like SOC2,HIPAA,GDPR,or PCI-DSS."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

[[create_resource]]
resource_type = "role"
relation_type = "BASELINE_TEMPLATE"
name = "observability-manager"
[create_resource.properties]
function = "manager"
scope = "observability"
description = "An observability manager collects disparate streams of operational data into one place."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

[[create_resource]]
resource_type = "role"
relation_type = "BASELINE_TEMPLATE"
name = "network-operator"
[create_resource.properties]
function = "operator"
scope = "network"
description = "The network operator designs the virtual layout of the cloud network,he defines security measures and manages access to gateways."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

origin_resource = "role"

[[link_resources]]
with = "identity"
match_with = [
  { expression = "{% if origin_resource.scope == target_resource.scope %}true{% endif %}" }
]
create_relation = { type = "RESPONSIBLE_FOR" }
