origin_resource = "account"

[[create_resource]]
resource_type = "observability"
match_on = [{ property = "logging", value = true }]
relation_type = "MONITORED_BY"
name = "{{- origin_resource.provider[0].name | lower -}}-{{- origin_resource.function | lower -}}-logging"
[create_resource.properties]
function = "{{- origin_resource.function -}}"
account = "{{- origin_resource.name -}}"
identity = "observability-manager"
description = "Logging account for the shared cloud estate."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

[[create_resource]]
resource_type = "observability"
match_on = [{ property = "flow_logs", value = true }]
relation_type = "MONITORED_BY"
name = "{{- origin_resource.provider[0].name | lower -}}-network-telemetry"
[create_resource.properties]
function = "{{- origin_resource.function -}}"
traffic_type = "ALL"
destination_type = "flow-logs"
retention_in_days = 90
account = "{{- origin_resource.name -}}"
identity = "network-operator"
description = "Flow Logs are a feature that enables the capture of IP traffic information to and from network interfaces. Unlike packet capture, which records the actual payload, flow logs function as metadata records of network telemetry."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
