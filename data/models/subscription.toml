[[create_resource]]
resource_type = "subscription"
name = " {{- tenant | lower -}}-cloud"
[create_resource.properties]
function = "cloud"
commercial_admin = "contract-manager"
technical_admin = "account-administrator"
home_region = "{{- location -}}"
description = "The subscription defines the cloud environment for the resident {{ tenant | capitalize }}."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

origin_resource = "subscription"

[[link_resources]]
with = "identity"
create_relation = { type = "BASELINE_TEMPLATE" }
