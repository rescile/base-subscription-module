origin_resource = "resident"

[[create_resource]]
resource_type = "subscription"
relation_type = "DEFINED_BY"
name = "{{- resident | lower -}}-{{- blueprint | lower -}}"
[create_resource.properties]
commercial_admin = "contract-manager@kpt.ch"
technical_admin = "cloud-administrator@kpt.ch"
home = "{{- location -}}"
environment = ["DEV", "PROD", "INT", "SRE"]
logging = true
auditing = true
description = "The subscription defines the cloud environment for the resident {{ resident | capitalize }}."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

origin_resource = "subscription"

[[link_resources]]
with = "identity"
join = { local = "commercial-admin", remote = "name" }
create_relation = { type = "RESPONSIBLE_FOR" }

[[link_resources]]
with = "identity"
join = { local = "technical-admin", remote = "name" }
create_relation = { type = "RESPONSIBLE_FOR" }
copy_properties = [
  { from = "name", as = "email" }
]
