origin_resource = "tenant"

[[create_resource]]
resource_type = "subscription"
name = " {{- tenant | lower -}}-cloud"
[create_resource.properties]
commercial_admin = "contract-manager"
technical_admin = "account-administrator"
home = "{{- location -}}"
public = ["domain.com"]
private = ["domain-dev.com", "domain-int.com"]
logging = true
auditing = true
description = "The subscription defines the cloud environment for the resident {{ tenant | capitalize }}."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

origin_resource = "subscription"

[[link_resources]]
with = "identity"
join = { local = "commercial_admin", remote = "name" }
create_relation = { type = "RESPONSIBLE_FOR" }

[[link_resources]]
with = "identity"
join = { local = "technical_admin", remote = "name" }
create_relation = { type = "RESPONSIBLE_FOR" }
copy_properties = [
  { from = "email", as = "email" }
]
