origin_resource = "filter"

[[create_resource]]
resource_type = "rule"
match_on = [{property = "function", value = "egress"}]
relation_type = "SATISFIES"
name = "allow-all"
[create_resource.properties]
function = "{{- origin_resource.function -}}"
action = "allow"
priority = 100
protocol = "tcp"
source = ["self"]
destination = ["0.0.0.0/0"]
destination_ports = ["0"]
log = true
description = "Allows unrestricted outbound traffic to assigned network zones."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

[[create_resource]]
resource_type = "rule"
match_on = [{property = "function", value = "ingress"}]
relation_type = "SATISFIES"
name = "allow-https"
[create_resource.properties]
function = "{{- origin_resource.function -}}"
action = "allow"
priority = 100
protocol = "tcp"
source = ["self"]
destination = ["0.0.0.0/0"]
destination_ports = ["443"]
log = true
description = "Default perimeter configuration that restricts inbound traffic from assigned network segments to https to protect networks, zones and segments."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

[[create_resource]]
resource_type = "rule"
match_on = [{property = "function", value = "ingress"}]
relation_type = "SATISFIES"
name = "allow-dns"
[create_resource.properties]
function = "{{- origin_resource.function -}}"
action = "allow"
priority = 110
protocol = "udp"
source = ["self"]
destination = ["resolver"]
destination_ports = ["53"]
log = true
description = "Default perimeter configuration that restricts inbound traffic from assigned network segments to dns to protect networks, zones and segments."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
