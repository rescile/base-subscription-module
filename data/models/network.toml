origin_resource = "router"

[[create_resource]]
resource_type = "network"
relation_type = "DEFINED_BY"
name = "{{- origin_resource.provider -}}-{{- origin_resource.region_code -}}-network"
[create_resource.properties]
function = "application"
region_code = "{{- origin_resource.region_code -}}"
address_space = [
    "private_application",
    "private_management"
]
routing = "regional"
firewall = ["default"]
dns = true
ipv6 = false
mtu = 1500
internet_access = false
