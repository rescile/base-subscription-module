origin_resource = "subscription"

[[create_resource]]
resource_type = "network"
relation_type = "DERIVED_FROM"
name = "{{ origin_resource.name }}-dev-network"
[create_resource.properties]
function = "{{- blueprint -}}"
environment = "dev"
cidr = "10.37.196.0/24"
provider = "aws"
public = "domain.com"
private = "domain-dev.com"
description = "A network segment is a portion of a computer network that's separated from the rest, either physically or logically. It behaves as a distinct, self-contained broadcast or addressing domain."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

