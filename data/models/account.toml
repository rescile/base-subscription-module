# A account represents a secure digital identity that provides access to cloud provider resources.
origin_resource = "provider"

regions = { "template!" = '''
    [
    {%- for region in origin_resource.regions | default(value=["ANY"]) | unique -%}
        {%- if not loop.first %}, {% endif -%}
        "{{ region }}"
    {%- endfor -%}
    ]
''' }

[[create_resource]]
match_on = { property = "active", value = true }
resource_type = "account"
relation_type = "DEFINED_BY"
name = "{{- origin_resource.name | lower -}}-account"
[create_resource.properties]
function = "{{ origin_resource.function }}"
region = "{{ regions }}"
provider = "{{- origin_resource.name -}}"
key = "{{- origin_resource.name | lower -}}-key"
logging = true
flow_logs = true
description = "The {{ origin_resource.name  }} account is a digital organization reference that grants authorized access to {{ origin_resource.name | capitalize }}'s cloud resources and enables a centralized management hub to automate cloud service deployments and configurations."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
