origin_resource = "subscription"

[[link_resources]]
with = "account"
create_relation = { type = "DEFINED_BY" }
copy_properties = [
  { from = "technical_admin", as = "technical_contact" },
  { from = "email", as = "email" },
  { from = "home_region", as = "home" }
]
