[[create_resource]]
resource_type = "provider"
name = "aws"
[create_resource.properties]
function = "platform"
display = "Amazon Web Services (AWS)"
active = true
clearance = "[ISAE,ISO27001,SOC2]"
terms = "https://aws.amazon.com/legal/service-level-agreements/"
description = "Amazon Web Services operates data centers to rent out computing power, storage, and/or software. The operator distinguishes itself through the broad service portfolio of platform services, ranging from serverless functions to hardware accelerators."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

origin_resource = "provider"

[[link_resources]]
with = "home"
create_relation = { type = "DERIVED_FROM" }
