origin_resource = "account"

[[create_resource]]
create_from = { property = "logins", as = "login" }
relation_type = "DERIVED_FROM"
name = "{{- property.value | lower -}}_login"
[create_resource.properties]
function = "{{ origin_resource.function }}"
description = "{{- origin_resource.description -}}"
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
