origin_resource = "account"

regions = { "json!" = "aws-regions.json"}
code = { "json!" = "airports.json", jmespath = "values(@)[?city ==  'Zurich' ] | [0]" }

[[create_resource]]
create_from = { property = "home", as = "region" }
relation_type = "DERIVED_FROM"
name = "{{- regions[property.value].aws_region_id -}}"
[create_resource.properties]
function = "platform"
country_code = "{{- regions[property.value].country_code -}}"
region_code = "{{- code.iata -}}"
timezone = "{{- code.tz -}}"
city = "{{- code.city -}}"
api = "https://service-code.region-code.amazonaws.com"
provider = "{{- origin_resource.provider[0].name -}}"
router = "{{- origin_resource.provider[0].name -}}-transit-router"
vault = "{{- origin_resource.provider[0].name -}}-{{- code.iata | lower -}}-vault"
services = "[kubernetes,container]"
databases = "[redshift,dynamodb]"
brokers = "[amq,kafka]"
description = "The region describes a physical, geographical location where data is stored, and applications run, managed by {{ origin_resource.provider[0].name | upper }}."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
