# This model represents a third tier model of a cloud domain and defines routers where provider resources become accessible.
origin_resource = "region"

# Create the resource type
[[create_resource]]
create_from = { property = "router"}
relation_type = "CONNECTS_TO"
[create_resource.properties]
function = "connectivity"
region = "{{- origin_resource.name -}}"
firewall = "{{- origin_resource.provider | lower -}}-{{- origin_resource.region_code | lower -}}-firewall"
ipv6 = false
description = "{{ origin_resource.provider | capitalize }}'s  transit router in {{ location | capitalize }} is a regional network function that analyzes incoming data packets and forwards them toward their intended destination."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
