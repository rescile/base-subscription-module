origin_resource = "subscription"

[[create_resource]]
resource_type = "resolver"
relation_type = "BASELINE_TEMPLATE"
name = "public-resolver"
[create_resource.properties]
function = "dns"
type = "A"
zones = ["domain.com"]
description = "A publis zone configuration contains all the records for an external domain (zone), directing DNS servers on the Internet how to resolve names within that zone."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

[[create_resource]]
resource_type = "resolver"
relation_type = "BASELINE_TEMPLATE"
name = "private-resolver"
[create_resource.properties]
function = "dns"
type = "A"
zones = ["domain-prod.com"]
description = "A private zone configuration contains all the records for an internal domain (zone), directing DNS servers in the internal network how to resolve names within that zone."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
