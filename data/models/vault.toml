# Defines operator roles at a cloud provider
origin_resource = "account"

vault_function = { "template!" = '''
{%- if origin_resource.function == "infrastructure" -%}
    hardware
{%- else -%}
    software
{%- endif -%}
''' }

[[create_resource]]
match_on = { or = [
    [ { property = "function", value = "infrastructure" } ],
    [ { property = "function", value = "platform" } ]
  ]
}
resource_type = "vault"
relation_type = "OPERATED_BY"
name = "{{- origin_resource.provider[0].name -}}-{{- origin_resource.function -}}-vault"
[create_resource.properties]
function = "{{- vault_function -}}"
description = "{{ origin_resource.provider[0].name | capitalize }}'s {{ vault_function }} vault is a key management system designed to protect sensitive information like passwords, encryption keys, and API tokens. It manages the lifecycle of these secrets, enforcing strict access control and encrypting the data at rest and in transit to mitigate the risk of data breaches."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
