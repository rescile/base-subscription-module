[[create_resource]]
resource_type = "rule"
relation_type = "PROTECTS"
name = "https-ingress-filter"
[create_resource.properties]
function = "ingress"
protocol = "tcp"
port = 443
enabled = true
stateful = true
default_action = "deny"
description = "Default perimeter protection configuration for networks, zones and segments."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

