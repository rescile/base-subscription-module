origin_resource = "service"

roles = { "json!" = "role.json" }
provider_name = { "function!" = "{{- origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower -}}" }

[[create_resource]]
resource_type = "role"
relation_type = "DEFINED_BY"
name = "{{- origin_resource.name | regexp(expr='s/^([^-]+-[^-]+)-.*/\\1/') | lower -}}-administrator"
[create_resource.properties]
function = "{{- origin_resource.function | lower -}}"
privilege = ["create", "read", "update", "delete"]
description = "The role describes the priviliges of a {{ origin_resource.function }} service administrator."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
