origin_resource = "key"

operator = { "json!" = "provider.json" }
provider_name = { "template!" = "{{- origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower -}}" }

[[create_resource]]
create_from = { property = "service" }
relation_type = "SATISFIES"
name = "{{- origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower -}}-{{- property.value -}}-service"
[create_resource.properties]
function = "{{ property.value -}}"
provider = "{{- operator[provider_name] -}}"
description = "The {{ property.value  -}} service is operated by {{- operator[provider_name].display -}}."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
