origin_resource = "login"

operator = { "json!" = "provider.json" }
provider_name = { "function!" = "{{- origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower -}}" }

[[create_resource]]
resource_type = "service"
relation_type = "DEPENDS_ON"
name = "{{ origin_resource.name | regexp(expr='s/^([^-]+-[^-]+-[^-]+)-.*/\\1/') | lower }}"
[create_resource.properties]
function = "{{- origin_resource.function -}}"
provider = "{{- operator[provider_name] -}}"
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

origin_resource = "service"

[[link_resources]]
with = "identity"
match_with = [
  { expression = "{% if origin_resource.function in target_resource.services %}true{% endif %}" }
]
create_relation = { type = "DEFINED_BY" }
