origin_resource = "wallet"

[[create_resource]]
resource_type = "key"
relation_type = "DEFINED_BY"
name = "{{ origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower }}-master-key"
[create_resource.properties]
function = "master"
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

[[create_resource]]
create_from = { property = "keys", as = "key" }
relation_type = "DEFINED_BY"
name = "{{ origin_resource.name | regexp(expr='s/^([^-]+-[^-]+)-.*/\\1/') | lower }}-key"
[create_resource.properties]
function = "{{- params.solution -}}"
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
