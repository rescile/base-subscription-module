origin_resource = "endpoint"

operator = { "json!" = "provider.json" }
provider_name = { "function!" = "{{- origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower -}}" }
services = { "json!" = "aws-roles.json", jmespath = "values(roles)[?service == 'connectivity' ] | [0]" }

[[create_resource]]
match_on = [{ property = "function", value = "connectivity" }]
resource_type = "{{- origin_resource.function | lower -}}"
relation_type = "DEFINED_BY"
name = "{{- origin_resource.name | regexp(expr='s/^([^-]+-[^-]+-[^-]+)-.*/\\1/') | lower -}}"
[create_resource.properties]
function = "{{- params.solution -}}"
provider = "{{- operator[provider_name] -}}"
component = "{{- services.component -}}"
description = "Databases provided by {{ operator[provider_name].display }} is an on-demand, scalable processing power—ranging from virtual machines to serverless containers—that is managed entirely through code. Access and inter-node communication rely on dynamic, short-lived IAM tokens and automated TLS certificates rather than static passwords."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

origin_resource = "connectivity"

decoder = {
    "directconnect" = "cross_connect",
    "ec2" = "tunnel"
}

[[create_resource]]
create_from = { property = "component" }
relation_type = "DERIVED_FROM"
name = "{{- origin_resource.name | regexp(expr='s/^([^-]+-[^-]+)-.*/\\1/') | lower -}}-{{- origin_resource._type -}}-{{- decoder[property.value] | lower -}}"
[create_resource.properties]
function = "{{- property.value -}}"
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
