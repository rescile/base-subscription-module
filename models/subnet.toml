origin_resource = "network"

subnets = { "template!" = '''
{%- set count = origin_resource.subnet | length -%}
{%- set range = origin_resource.cidr -%}
{{- range | cidr_split_n(n=count) | join(sep=',') -}}
''' }

[[create_resource]]
create_from = { property = "subnet" }
relation_type = "DERIVED_FROM"
name = "{{- origin_resource.name -}}_{{- property.value -}}" # Improve using regex
[create_resource.properties]
cidr = "{{- subnets[property.index] -}}"
description = "tbd"
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
