origin_resource = "service"

operator = { "json!" = "provider.json" }
provider_name = { "function!" = "{{- origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower -}}" }

[[create_resource]]
resource_type = "login"
relation_type = "DEFINED_BY"
name = "{{ origin_resource.name | regexp(expr='s/^([^-]+-[^-]+-[^-]+)-.*/\\1/') | lower }}-login"
[create_resource.properties]
function = "{{- origin_resource.function -}}"
provider = "{{- operator[provider_name] -}}"
permission = ["create", "read", "update", "delete"]
channel = ["email", "alert", "notification"]
description = "The login provides access and defines the permissions of a {{ origin_resource.function }} service administrator."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

origin_resource = "identity"

[[link_resources]]
with = "login"
match_with = [
  { expression = "{% if target_resource.function in origin_resource.services %}true{% endif %}" }
]
create_relation = { type = "RESPONSIBLE_FOR" }
