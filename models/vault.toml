operator = { "function!" = '''
{%- for sub in subscription -%}
    {% set_global test = sub %}
{%- endfor -%}
{{- test -}}
''' }

origin_resource = "record"

[[create_resource]]
match_on = [ { property = "function", value = "vault" } ]
resource_type = "vault"
relation_type = "SATISFIES"
name = "{{- params.solution | lower -}}-vault" # Need to get the provider name here
[create_resource.properties]
function = "encryption"
test = "{{- operator -}}"
key = "{{- params.solution | lower -}}-vault-key"
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

