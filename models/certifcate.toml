origin_resource = "wallet"

[[create_resource]]
create_from = { property = "certificate" }
relation_type = "DERIVED_FROM"
name = "{{- origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower -}}-{{- property.value | lower -}}-certificate"
[create_resource.properties]
function = "{{- property.value | lower -}}"
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

origin_resource = "service"

[[link_resources]]
with = "certificate"
match_with = [
  { expression = "{% if target_resource.function == origin_resource.function %}true{% endif %}" }
]
create_relation = { type = "PROTECTS" }
