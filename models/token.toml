origin_resource = "key"

[[create_resource]]
create_from = { property = "token" }
relation_type = "DEFINED_BY"
name = "{{ origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower }}-{{- property.value -}}-token"
[create_resource.properties]
function = "property.value"
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
