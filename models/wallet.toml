origin_resource = "vault"

provider_name = { "function!" = "{{- origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower -}}" }
resource_id = { "json!" = "dictionary.json", jmespath = "values(@)[?name == provider_name ] | [0]" }

[[create_resource]]
create_from = { property = "wallet" }
relation_type = "DEPENDS_ON"
name = "{{ origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower }}-{{- property.value | lower -}}-{{- resource_id.wallet -}}"
[create_resource.properties]
function = "{{- property.value | lower -}}"
provider_type = "{{- resource_id.wallet -}}"
key = "{{- origin_resource.keys -}}"
secret = ["compute", "database", "iam", "vpn"]
certificate = ["storage", "database", "kubernetes", "loadbalancer", "dns", "iam", "vpn", "connectivity"]
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

origin_resource = "wallet"

[[link_resources]]
with = "subscription"
create_relation = { type = "SATISFIES" }
copy_properties = [
  { from = "portfolio", as = "token" }
]
