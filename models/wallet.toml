origin_resource = "key"

[[create_resource]]
create_from = { property = "wallet" }
relation_type = "DEFINED_BY"
name = "{{ origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower }}-{{- property.value -}}-encryption-key"
[create_resource.properties]
function = "{{- property.value -}}"
service = ["storage"]
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
