origin_resource = "certificate"

operator = { "json!" = "provider.json" }
provider_name = { "template!" = "{{- origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower -}}" }

[[create_resource]]
resource_type = "endpoint"
relation_type = "SATISFIES"
name = "{{- provider_name -}}-{{- params.solution | lower -}}-{{- origin_resource.function | lower -}}-endpoint"
[create_resource.properties]
function = "{{ origin_resource.function -}}"
provider = "{{- operator[provider_name] -}}"
description = "The {{ origin_resource.function -}} endpoint is provided by {{- operator[provider_name].display -}}."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
